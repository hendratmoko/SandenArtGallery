<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tentacle Sync Cursor Demo</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #05070d;
    overflow: hidden;
    cursor: none;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100vh;
  }
  #tentacleCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #hint {
    position: absolute;
    top: 24px;
    left: 24px;
    color: rgba(180, 210, 255, 0.65);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    letter-spacing: 0.02em;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="tentacleCanvas"></canvas>
  <div id="hint">Gerakkan kursor / sentuh layar — Tentacle Sync Cursor</div>
</div>

<script>
(function () {
  const canvas = document.getElementById('tentacleCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- Cursor / head state ----
  const mouse = { x: W / 2, y: H / 2 };
  const head = { x: W / 2, y: H / 2 };
  let hasPointer = false;

  window.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
    hasPointer = true;
  });
  window.addEventListener('touchmove', (e) => {
    if (!e.touches.length) return;
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.touches[0].clientX - rect.left;
    mouse.y = e.touches[0].clientY - rect.top;
    hasPointer = true;
  }, { passive: true });

  // ---- Tentacle setup ----
  const TENTACLE_COUNT = 32;
  const SEGMENT_COUNT = 28;
  const SEGMENT_LENGTH = 6.5;

  function makeTentacle(index) {
    const angle = (index / TENTACLE_COUNT) * Math.PI * 2;
    const segments = [];
    for (let i = 0; i < SEGMENT_COUNT; i++) {
      segments.push({ x: head.x, y: head.y });
    }
    return {
      angle,                              // anchor angle around the head
      phase: Math.random() * Math.PI * 2, // per-tentacle wave phase
      speed: 0.10 + Math.random() * 0.14, // how eagerly it follows the head
      wobbleAmp: 6 + Math.random() * 10,  // sideways organic wobble
      wobbleFreq: 0.6 + Math.random() * 1.1,
      hue: 200 + Math.random() * 40,      // blue -> cyan range
      segments
    };
  }

  let tentacles = Array.from({ length: TENTACLE_COUNT }, (_, i) => makeTentacle(i));

  let t = 0; // global time

  function updateHead() {
    // head eases toward the real cursor position (spring-like)
    head.x += (mouse.x - head.x) * 0.18;
    head.y += (mouse.y - head.y) * 0.18;
  }

  function updateTentacle(tent, idx) {
    const anchorRadius = 3;
    const anchorX = head.x + Math.cos(tent.angle + t * 0.15) * anchorRadius;
    const anchorY = head.y + Math.sin(tent.angle + t * 0.15) * anchorRadius;

    const first = tent.segments[0];
    first.x += (anchorX - first.x) * tent.speed;
    first.y += (anchorY - first.y) * tent.speed;

    for (let i = 1; i < tent.segments.length; i++) {
      const prev = tent.segments[i - 1];
      const seg = tent.segments[i];

      let dx = prev.x - seg.x;
      let dy = prev.y - seg.y;
      let dist = Math.hypot(dx, dy) || 0.0001;
      let angle = Math.atan2(dy, dx);

      // organic sideways wobble, stronger toward the tail (FABRIK-lite chain)
      const wobble =
        Math.sin(t * tent.wobbleFreq + i * 0.35 + tent.phase) *
        tent.wobbleAmp *
        (i / tent.segments.length);

      const perpX = -Math.sin(angle);
      const perpY = Math.cos(angle);

      seg.x = prev.x - Math.cos(angle) * SEGMENT_LENGTH + perpX * wobble * 0.15;
      seg.y = prev.y - Math.sin(angle) * SEGMENT_LENGTH + perpY * wobble * 0.15;
    }
  }

  function drawTentacle(tent) {
    const segs = tent.segments;
    ctx.beginPath();
    ctx.moveTo(segs[0].x, segs[0].y);
    for (let i = 1; i < segs.length - 1; i++) {
      const xc = (segs[i].x + segs[i + 1].x) / 2;
      const yc = (segs[i].y + segs[i + 1].y) / 2;
      ctx.quadraticCurveTo(segs[i].x, segs[i].y, xc, yc);
    }
    ctx.strokeStyle = `hsla(${tent.hue}, 100%, 65%, 0.55)`;
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    ctx.shadowColor = `hsla(${tent.hue}, 100%, 60%, 0.9)`;
    ctx.shadowBlur = 8;
    ctx.stroke();
  }

  function drawHead() {
    const r = 9;
    const grad = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, r * 4);
    grad.addColorStop(0, 'rgba(140, 200, 255, 0.95)');
    grad.addColorStop(0.4, 'rgba(80, 160, 255, 0.35)');
    grad.addColorStop(1, 'rgba(80, 160, 255, 0)');
    ctx.beginPath();
    ctx.fillStyle = grad;
    ctx.arc(head.x, head.y, r * 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.fillStyle = '#bfe3ff';
    ctx.shadowColor = '#5fb2ff';
    ctx.shadowBlur = 20;
    ctx.arc(head.x, head.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function frame() {
    t += 0.016;
    ctx.clearRect(0, 0, W, H);

    updateHead();
    for (let i = 0; i < tentacles.length; i++) {
      updateTentacle(tentacles[i], i);
    }

    ctx.globalCompositeOperation = 'lighter';
    for (const tent of tentacles) drawTentacle(tent);
    ctx.globalCompositeOperation = 'source-over';

    drawHead();

    requestAnimationFrame(frame);
  }

  // idle auto-drift until the user moves the pointer, so it's alive immediately
  function idleDrift() {
    if (!hasPointer) {
      mouse.x = W / 2 + Math.cos(t * 0.5) * Math.min(W, H) * 0.22;
      mouse.y = H / 2 + Math.sin(t * 0.7) * Math.min(W, H) * 0.16;
    }
    requestAnimationFrame(idleDrift);
  }

  requestAnimationFrame(frame);
  requestAnimationFrame(idleDrift);
})();
</script>
</body>
</html>
